name: Copy selected docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/copy-selected-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Clone source repository and copy selected files
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/alharbikh/my_doc.git /tmp/my_doc
          cp /tmp/my_doc/employee_warning_form_v2.html ./employee_warning_form_v2.html
          cp /tmp/my_doc/forms_viewer_print_v2.html ./forms_viewer_print_v2.html
          cp /tmp/my_doc/school_decisions_forms.html ./school_decisions_forms.html

      - name: Commit copied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add employee_warning_form_v2.html forms_viewer_print_v2.html school_decisions_forms.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Copy selected docs from my_doc"
          git push
