name: Copy selected docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/copy-selected-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Copy selected HTML files from my_doc
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/alharbikh/my_doc/main/employee_warning_form_v2.html" -o employee_warning_form_v2.html
          curl -fsSL "https://raw.githubusercontent.com/alharbikh/my_doc/main/forms_viewer_print_v2.html" -o forms_viewer_print_v2.html
          curl -fsSL "https://raw.githubusercontent.com/alharbikh/my_doc/main/school_decisions_forms.html" -o school_decisions_forms.html

      - name: Commit copied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add employee_warning_form_v2.html forms_viewer_print_v2.html school_decisions_forms.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Copy selected docs from my_doc"
          git push
